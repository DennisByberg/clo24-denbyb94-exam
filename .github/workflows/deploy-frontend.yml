# Deploy Next.js frontend to Azure Static Web Apps
#
# Required GitHub Secrets:
# - NEXT_PUBLIC_API_URL: Backend API URL for client-side API calls
#   Get from: terraform output app_service_url
#   Example: https://app-ace-group-backend.azurewebsites.net

# - NEXT_PUBLIC_AZURE_BLOB_URL: Azure Blob Storage URL for restaurant images
#   Get from: terraform output restaurant_images_container_url
#   Example: https://acegroupstorage.blob.core.windows.net/restaurant-images/

# - AZURE_STATIC_WEB_APPS_API_TOKEN: Deployment token for Static Web Apps
#   Get from: terraform output -raw static_web_app_deployment_token
#
# This workflow:
# 1. Installs Bun 1.3.1
# 2. Installs dependencies with bun install
# 3. Builds Next.js app with environment variables
# 4. Deploys to Azure Static Web Apps

name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AZURE_BLOB_URL: ${{ secrets.NEXT_PUBLIC_AZURE_BLOB_URL }}
        run: bun run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/frontend/out'
          output_location: ''
          skip_app_build: true
