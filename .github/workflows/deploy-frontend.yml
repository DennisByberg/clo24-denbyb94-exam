# Deploy Next.js frontend to Azure App Service
#
# Required GitHub Secrets:
# - AZURE_CREDENTIALS: Azure Service Principal credentials (JSON)
#   Create once: az ad sp create-for-rbac --name "github-actions-ace-group" --role contributor --scopes /subscriptions/{subscription-id}/resourceGroups/rg-ace-group --sdk-auth
#   Store entire JSON output as secret
#
# - AZURE_SUBSCRIPTION_ID: Azure subscription ID
#   Get from: terraform output or Azure Portal
#
# - NEXT_PUBLIC_API_URL: Backend API URL for client-side API calls
#   Get from: terraform output app_service_url
#   Example: https://app-ace-group-backend.azurewebsites.net
#
# - NEXT_PUBLIC_AZURE_BLOB_URL: Azure Blob Storage URL for restaurant images
#   Get from: terraform output restaurant_images_container_url
#   Example: https://acegroupstorage.blob.core.windows.net/restaurant-images/
#
# Note: NEXTAUTH_SECRET is managed via Azure Key Vault in App Service settings
#
# This workflow:
# 1. Installs Bun 1.3.1 and Node.js 20
# 2. Installs dependencies with bun install
# 3. Builds Next.js app with environment variables
# 4. Deploys to Azure App Service using Service Principal

name: Deploy Frontend to Azure App Service

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get secrets from Azure Key Vault
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "GOOGLE_CLIENT_ID=$(az keyvault secret show --name google-client-id --vault-name kv-ace-group --query value -o tsv)" >> $GITHUB_ENV
            echo "GOOGLE_CLIENT_SECRET=$(az keyvault secret show --name google-client-secret --vault-name kv-ace-group --query value -o tsv)" >> $GITHUB_ENV
            echo "NEXTAUTH_SECRET=$(az keyvault secret show --name nextauth-secret --vault-name kv-ace-group --query value -o tsv)" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AZURE_BLOB_URL: ${{ secrets.NEXT_PUBLIC_AZURE_BLOB_URL }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
        run: bun run build

      - name: Prepare standalone deployment
        working-directory: frontend
        run: |
          cp -r .next/standalone ./deploy
          cp -r .next/static ./deploy/.next/static
          cp -r public ./deploy/public

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ace-group-frontend
          package: frontend/deploy
