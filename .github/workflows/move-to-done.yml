name: Move to Done on Main Push

on:
  push:
    branches:
      - main

jobs:
  move-to-done:
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get commits in this push
            const commits = context.payload.commits || [];

            // Extract issue numbers from commit messages
            const issueNumbers = new Set();
            for (const commit of commits) {
              const matches = commit.message.match(/#(\d+)/g);
              if (matches) {
                matches.forEach(match => {
                  issueNumbers.add(parseInt(match.substring(1)));
                });
              }
            }

            if (issueNumbers.size === 0) {
              console.log('No issue numbers found in commit messages');
              return;
            }

            console.log(`Found issue numbers: ${Array.from(issueNumbers).join(', ')}`);

            // Hard-code project number (from your screenshot: project #14)
            const PROJECT_NUMBER = 14;

            // GraphQL query to get project by number
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    title
                    number
                  }
                }
              }
            `;

            let projectData;
            try {
              projectData = await github.graphql(projectQuery, { 
                owner, 
                number: PROJECT_NUMBER 
              });
            } catch (error) {
              console.log(`Error fetching project #${PROJECT_NUMBER}:`, error.message);
              console.log('Make sure the project number is correct and the token has access');
              return;
            }

            if (!projectData.user.projectV2) {
              console.log(`Project #${PROJECT_NUMBER} not found`);
              return;
            }

            const project = projectData.user.projectV2;
            console.log(`Using project: ${project.title} (#${project.number})`);

            // Get project fields and find the Status field
            const fieldQuery = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const fieldData = await github.graphql(fieldQuery, { projectId: project.id });
            const statusField = fieldData.node.fields.nodes.find(field => 
              field.name && field.name.toLowerCase() === 'status'
            );

            if (!statusField) {
              console.log('Status field not found');
              return;
            }

            const doneOption = statusField.options.find(opt => 
              opt.name.toLowerCase() === 'done'
            );

            if (!doneOption) {
              console.log('Done status not found');
              console.log('Available statuses:', statusField.options.map(o => o.name).join(', '));
              return;
            }

            console.log(`Moving to status: ${doneOption.name}`);

            // Process each issue
            for (const issueNumber of issueNumbers) {
              try {
                // Get issue node ID
                const issueQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        id
                        title
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                `;

                const issueData = await github.graphql(issueQuery, {
                  owner,
                  repo,
                  number: issueNumber
                });

                const issue = issueData.repository.issue;
                if (!issue) {
                  console.log(`Issue #${issueNumber} not found`);
                  continue;
                }

                // Find project item for this issue in our project
                const projectItem = issue.projectItems.nodes.find(
                  item => item.project.id === project.id
                );

                if (!projectItem) {
                  console.log(`Issue #${issueNumber} not in project, skipping`);
                  continue;
                }

                // Update project item status
                const updateMutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $value }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;

                await github.graphql(updateMutation, {
                  projectId: project.id,
                  itemId: projectItem.id,
                  fieldId: statusField.id,
                  value: doneOption.id
                });

                console.log(`Moved issue #${issueNumber} to Done`);

                // Close the issue
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed',
                });

                console.log(`Closed issue #${issueNumber}`);
              } catch (error) {
                console.error(`Error processing issue #${issueNumber}:`, error.message);
              }
            }
