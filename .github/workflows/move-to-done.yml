name: Move to Done on Main Push

on:
  push:
    branches:
      - main

jobs:
  move-to-done:
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            // Get commits in this push
            const commits = context.payload.commits || [];

            // Extract issue numbers from commit messages
            const issueNumbers = new Set();
            for (const commit of commits) {
              const matches = commit.message.match(/#(\d+)/g);
              if (matches) {
                matches.forEach(match => {
                  issueNumbers.add(match.substring(1));
                });
              }
            }

            console.log(`Found issue numbers: ${Array.from(issueNumbers).join(', ')}`);

            // Get project information
            const { data: projects } = await github.rest.projects.listForRepo({
              owner,
              repo,
            });

            if (projects.length === 0) {
              console.log('No projects found');
              return;
            }

            const project = projects[0];
            console.log(`Using project: ${project.name}`);

            // Get project columns
            const { data: columns } = await github.rest.projects.listColumns({
              project_id: project.id,
            });

            const doneColumn = columns.find(col => 
              col.name.toLowerCase().includes('done') || 
              col.name.toLowerCase() === 'done'
            );

            if (!doneColumn) {
              console.log('Done column not found');
              console.log('Available columns:', columns.map(c => c.name).join(', '));
              return;
            }

            console.log(`Moving to column: ${doneColumn.name}`);

            // Move each issue to Done
            for (const issueNumber of issueNumbers) {
              try {
                // Get issue to verify it exists
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: parseInt(issueNumber),
                });

                // Find the card for this issue across all columns
                let cardId = null;
                for (const column of columns) {
                  const { data: cards } = await github.rest.projects.listCards({
                    column_id: column.id,
                  });
                  
                  const card = cards.find(c => 
                    c.content_url && c.content_url.endsWith(`/issues/${issueNumber}`)
                  );
                  
                  if (card) {
                    cardId = card.id;
                    console.log(`Found card ${cardId} in column ${column.name}`);
                    break;
                  }
                }

                if (cardId) {
                  // Move the card
                  await github.rest.projects.moveCard({
                    card_id: cardId,
                    position: 'top',
                    column_id: doneColumn.id,
                  });
                  console.log(`Moved issue #${issueNumber} to Done`);
                  
                  // Optionally close the issue
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: parseInt(issueNumber),
                    state: 'closed',
                  });
                  console.log(`Closed issue #${issueNumber}`);
                } else {
                  console.log(`Card not found for issue #${issueNumber}`);
                }
              } catch (error) {
                console.error(`Error processing issue #${issueNumber}:`, error.message);
              }
            }
