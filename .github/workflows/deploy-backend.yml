# Deploy FastAPI backend to Azure App Service
#
# Required GitHub Secrets:
# - DATABASE_URL: PostgreSQL connection string for running migrations
#   Get from: terraform output -raw postgresql_connection_string
#   Example: postgresql://user:pass@host:5432/db?sslmode=require

# - AZURE_APP_SERVICE_NAME: Name of the Azure App Service
#   Get from: terraform output app_service_name
#   Example: app-ace-group-backend

# - AZURE_APP_SERVICE_PUBLISH_PROFILE: Publish profile XML from Azure Portal
#   Get from: App Service > Deployment Center > Manage publish profile
#
# This workflow:
# 1. Installs Python 3.13 and UV package manager
# 2. Installs dependencies with uv sync
# 3. Runs Alembic database migrations
# 4. Deploys to Azure App Service using publish profile

name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # NOTE: Running migrations before deployment has risks:
      # - If deployment fails after migrations, database is updated but code is not
      # - Concurrent deployments could cause race conditions
      # For production, consider: separate manual workflow, startup command, or blue-green deployment
      - name: Run Alembic migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Rollback migration on failure
        if: failure() && steps.migrate.outcome == 'failure'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Migration failed, attempting rollback..."
          uv run alembic downgrade -1
          exit 1

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: backend
