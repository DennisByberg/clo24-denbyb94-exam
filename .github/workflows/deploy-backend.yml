# Deploy FastAPI backend to Azure App Service
#
# Required GitHub Secrets:
# - AZURE_CREDENTIALS: Azure Service Principal credentials (JSON)
#   Create once: az ad sp create-for-rbac --name "github-actions-ace-group" --role contributor --scopes /subscriptions/{subscription-id}/resourceGroups/rg-ace-group --sdk-auth
#   Store entire JSON output as secret
#
# This workflow:
# 1. Installs Python 3.13 and UV package manager
# 2. Installs dependencies with uv sync
# 3. Fetches DATABASE_URL from Azure Key Vault
# 4. Runs Alembic database migrations
# 5. Deploys to Azure App Service using Service Principal

name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Azure App Service needs all files including pyproject.toml and uv.lock
      # The startup.sh script will handle installing UV and dependencies on the server

      # Fetch DATABASE_URL from Azure Key Vault for migrations
      - name: Get Database URL from Key Vault
        id: get-db-url
        run: |
          DATABASE_URL=$(az keyvault secret show --name database-url --vault-name kv-ace-group --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_OUTPUT

      # NOTE: Running migrations before deployment has risks:
      # - If deployment fails after migrations, database is updated but code is not
      # - Concurrent deployments could cause race conditions
      # For production, consider: separate manual workflow, startup command, or blue-green deployment
      - name: Run Alembic migrations
        id: migrate
        env:
          DATABASE_URL: ${{ steps.get-db-url.outputs.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Rollback migration on failure
        if: failure() && steps.migrate.outcome == 'failure'
        env:
          DATABASE_URL: ${{ steps.get-db-url.outputs.DATABASE_URL }}
        run: |
          echo "Migration failed, attempting rollback..."
          uv run alembic downgrade -1
          exit 1

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ace-group-backend
          package: backend
