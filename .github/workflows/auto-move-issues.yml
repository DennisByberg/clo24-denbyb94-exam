name: Auto-move Issues in Project

on:
  push:
    branches:
      - dev
      - main

jobs:
  move-to-pre-prod:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Pre-Prod
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const PROJECT_NUMBER = 14;
            const TARGET_STATUS = 'Pre-Prod';

            const issueNumbers = new Set();
            (context.payload.commits || []).forEach(commit => {
              const matches = commit.message.match(/#(\d+)/g);
              if (matches) matches.forEach(m => issueNumbers.add(parseInt(m.substring(1))));
            });

            if (issueNumbers.size === 0) return;

            const { user } = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: context.repo.owner, number: PROJECT_NUMBER });

            const project = user.projectV2;
            if (!project) return;

            const statusField = project.fields.nodes.find(f => f.name?.toLowerCase() === 'status');
            const statusOption = statusField?.options.find(o => 
              o.name.toLowerCase().includes(TARGET_STATUS.toLowerCase().split('-')[0])
            );

            if (!statusOption) return;

            for (const num of issueNumbers) {
              try {
                const { repository } = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        id
                        projectItems(first: 10) {
                          nodes { id project { id } }
                        }
                      }
                    }
                  }
                `, { owner: context.repo.owner, repo: context.repo.repo, number: num });

                const issue = repository.issue;
                let itemId = issue.projectItems.nodes.find(i => i.project.id === project.id)?.id;

                if (!itemId) {
                  const result = await github.graphql(`
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                        item { id }
                      }
                    }
                  `, { projectId: project.id, contentId: issue.id });
                  itemId = result.addProjectV2ItemById.item.id;
                }

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }
                    ) {
                      projectV2Item { id }
                    }
                  }
                `, { 
                  projectId: project.id, 
                  itemId, 
                  fieldId: statusField.id, 
                  optionId: statusOption.id 
                });

                console.log(`✓ #${num} → ${TARGET_STATUS}`);
              } catch (error) {
                console.error(`✗ #${num}: ${error.message}`);
              }
            }

  move-to-done:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const PROJECT_NUMBER = 14;
            const TARGET_STATUS = 'Done';

            const issueNumbers = new Set();
            (context.payload.commits || []).forEach(commit => {
              const matches = commit.message.match(/#(\d+)/g);
              if (matches) matches.forEach(m => issueNumbers.add(parseInt(m.substring(1))));
            });

            if (issueNumbers.size === 0) return;

            const { user } = await github.graphql(`
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: context.repo.owner, number: PROJECT_NUMBER });

            const project = user.projectV2;
            if (!project) return;

            const statusField = project.fields.nodes.find(f => f.name?.toLowerCase() === 'status');
            const statusOption = statusField?.options.find(o => o.name.toLowerCase() === TARGET_STATUS.toLowerCase());

            if (!statusOption) return;

            for (const num of issueNumbers) {
              try {
                const { repository } = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        id
                        projectItems(first: 10) {
                          nodes { id project { id } }
                        }
                      }
                    }
                  }
                `, { owner: context.repo.owner, repo: context.repo.repo, number: num });

                const issue = repository.issue;
                const itemId = issue.projectItems.nodes.find(i => i.project.id === project.id)?.id;

                if (!itemId) continue;

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }
                    ) {
                      projectV2Item { id }
                    }
                  }
                `, { 
                  projectId: project.id, 
                  itemId, 
                  fieldId: statusField.id, 
                  optionId: statusOption.id 
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                });

                console.log(`✓ #${num} → ${TARGET_STATUS} (closed)`);
              } catch (error) {
                console.error(`✗ #${num}: ${error.message}`);
              }
            }
