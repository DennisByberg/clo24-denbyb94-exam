# Docker Compose configuration for local development
# Runs FastAPI backend and PostgreSQL database with proper networking and volumes

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ess-booking-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ess_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ess_booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
    container_name: ess-booking-backend
    environment:
      DATABASE_URL: postgresql://admin:pass@db:5432/ess_booking_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# Named volumes for data persistence
volumes:
  postgres_data: